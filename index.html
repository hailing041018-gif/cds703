<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat &amp; Mouse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title"></h1>
      <div class="stats">
        <span><span id="label-score"></span><strong id="score">0</strong></span>
        <span><span id="label-time"></span><strong id="time">60</strong>s</span>
      </div>
    </header>
    <p class="hint" id="hint"></p>
    <canvas id="game" width="800" height="520"></canvas>
    <div class="overlay hidden" id="overlay">
      <div class="panel">
        <h2 id="overlay-title"></h2>
        <p id="overlay-msg"></p>
        <button type="button" id="start-btn"></button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
